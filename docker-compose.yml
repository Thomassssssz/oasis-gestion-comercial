# Base de datos PostgreSQL solo para DESARROLLO.
# Las credenciales vienen del archivo .env (que no se sube a GitHub).
# Copiá .env.example a .env y completá los valores antes de levantarla.

services:
  db:
    image: postgres:16-alpine
    container_name: oasis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Definí POSTGRES_DB en el archivo .env}
    ports:
      # Solo accesible desde tu propia computadora, no desde la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oasis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oasis_pgdata:
